name: iOS Deploy

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload build to TestFlight after export
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Archive and Deploy
    runs-on: macos-15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./scripts/ci-install-signing.sh

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/ci-install-provisioning-profile.sh

      - name: Archive and export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: ./scripts/ci-archive.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Landmann-Smart-Temperature-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Locate IPA
        id: ipa
        run: echo "path=$(ls build/export/*.ipa | head -1)" >> "${GITHUB_OUTPUT}"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload_testflight }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
